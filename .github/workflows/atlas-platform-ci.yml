name: Atlas Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: atlas-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Atlas Platform (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # Intentionally disable dependency caching. The repository may place
          # Atlas in different supported directories, and a missing cache
          # lockfile path must never fail or warn during setup.
          package-manager-cache: false

      - name: Locate Atlas Platform
        id: locate
        run: |
          set -euo pipefail

          candidates=(
            "atlas-platform"
            "vmp-master/atlas-platform"
            "Atlas-VMP-Synced/vmp-master/atlas-platform"
            "Atlas-Platform-Deploy/atlas-platform"
            "Atlas-Platform-Deploy-Package/atlas-platform"
            "."
          )

          for candidate in "${candidates[@]}"; do
            if [[ -f "$candidate/package.json" && -f "$candidate/server.js" ]]; then
              if node -e 'const p = require(process.argv[1]); process.exit(p.name === "atlas-vmp-platform" ? 0 : 1)' "./$candidate/package.json"; then
                echo "project_dir=$candidate" >> "$GITHUB_OUTPUT"
                echo "Atlas Platform found at: $candidate"
                exit 0
              fi
            fi
          done

          echo "::error title=Atlas Platform not found::Could not find package.json and server.js for atlas-vmp-platform. Expected atlas-platform/, vmp-master/atlas-platform/, or the project root."
          echo "Repository files near the root:"
          find . -maxdepth 3 -type f \( -name package.json -o -name server.js \) -print | sort | head -100
          exit 1

      - name: Verify package and lockfile
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -f package.json || { echo "::error::package.json is missing"; exit 1; }
          test -f package-lock.json || { echo "::error title=Missing npm lockfile::Commit package-lock.json beside package.json so npm ci can install reproducibly."; exit 1; }
          node -e 'const p = require("./package.json"); if (p.name !== "atlas-vmp-platform") { console.error(`Unexpected package name: ${p.name}`); process.exit(1); }'

      - name: Install locked dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run check

      - name: Run automated tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          CI: 'true'
        run: npm test
